manifest_version: 1
name: browserclaw
version: '3.1.0'
description: 'BrowserClaw — High-speed, dual-brain Chrome browser automation with 1-based DOM indexing, visual fallbacks, Jev System 1 micro-loop, and local MCP bridge.'
author: GoldenLoaf24h
license: AGPL-3.0
homepage: https://github.com/GoldenLoaf24h/browserclaw
provides_tools:
  - browserclaw_act_toward_goal
  - browserclaw_navigate
  - browserclaw_read_dom
  - browserclaw_interact_index
  - browserclaw_fill_index
  - browserclaw_batch_actions
  - browserclaw_screenshot
  - browserclaw_smart_scroll
  - browserclaw_scroll_until_found
  - browserclaw_inspect_media
  - browserclaw_grep
  - browserclaw_get_markdown
  - browserclaw_switch_tab
  - browserclaw_close_tabs
  - browserclaw_get_windows_and_tabs
  - browserclaw_tool_docs
  - browserclaw_insert_media
  - browserclaw_extract
provides_hooks: []
provides_middleware: []
requires_env: []

config_schema:
  native_server_port:
    type: number
    default: 12306
    description: 'Port where the BrowserClaw Native Server is listening (default: 12306)'
  auth_token:
    type: secret
    env: BROWSERCLAW_MCP_TOKEN
    description: 'Authentication token for connecting to BrowserClaw native server'
  isolate_modal:
    type: boolean
    default: false
    description: 'When true, automatically isolates active modal dialogs in browserclaw_read_dom'
